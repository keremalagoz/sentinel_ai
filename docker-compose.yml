# SENTINEL AI - Docker Compose Configuration
# Sprint 3.3: Qwen 2.5 3B (primary) + legacy WhiteRabbitNeo support
# Usage: docker-compose up -d

services:
  # ============================================
  # Service 1: Ollama LLM Service (Port 8002)
  # Primary: Qwen 2.5 3B Instruct (1.9 GB)
  # ============================================
  ollama-service:
    build:
      context: .
      dockerfile: docker/ollama/Dockerfile
    container_name: sentinel-ollama
    ports:
      - "8002:11434"  # External:Internal
    volumes:
      - ollama_models:/root/.ollama  # Model cache
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_GPU_LAYERS=99
      - SENTINEL_MODEL=qwen2.5          # qwen2.5 | whiterabbitneo | both
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s  # Qwen 2.5 indirme icin 2 dakika yeterli
    networks:
      - sentinel-net

  # ============================================
  # Service 2: API Backend (Port 8000)
  # ============================================
  api-service:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: sentinel-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # Database persistence
      - ./temp:/app/temp  # Temporary files
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/sentinel_api.db
      - OLLAMA_URL=http://ollama-service:11434
      - SENTINEL_CATEGORY_MODEL=sentinel-qwen
    depends_on:
      - ollama-service
    restart: unless-stopped
    networks:
      - sentinel-net

  # ============================================
  # Service 3: Security Tools (Nmap, Gobuster, etc.)
  # ============================================
  tools-service:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    container_name: sentinel-tools
    volumes:
      - ./temp:/app/output  # Scan results
    networks:
      - sentinel-net
    cap_add:
      - NET_RAW      # Nmap -sS icin gerekli
      - NET_ADMIN    # Network tarama icin gerekli
    restart: unless-stopped
    stdin_open: true
    tty: true

# Named volumes for model persistence
volumes:
  ollama_models:
    driver: local

# Custom network for service isolation
networks:
  sentinel-net:
    driver: bridge
